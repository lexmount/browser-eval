name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[test,browser-use-eval,reference-audit]'
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest tests/browser_use -q
      - run: node tests/test_report_ui.mjs && node tests/test_report_loader.mjs
      - run: python -m harness.web_fetch validate --providers fixture
      - run: python -m harness.web_fetch run --providers fixture --runs 1 --delay 0 --output /tmp/browser-harness-demo
