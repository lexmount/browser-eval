name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.8"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: make setup-test
      - run: make ci
      - name: Build and exercise the installed package
        run: |
          uv build --wheel
          wheel="$PWD/$(ls dist/*.whl)"
          package_smoke="$PWD/tests/package_smoke.py"
          markdown_package="$PWD/node_modules/node-html-markdown"
          cd "$(mktemp -d)"
          uv run --no-project --isolated --with "$wheel" browser-harness-eval validate
          uv run --no-project --isolated --with "$wheel" browser-harness-eval run --delay 0 --output "$PWD/example"
          uv run --no-project --isolated --with "$wheel" python "$package_smoke" --node-html-markdown-path "$markdown_package"
