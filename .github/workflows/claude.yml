name: Claude 中文审查

env:
  CLAUDE_REVIEW_STANDARDS: >-
    你在 browser-eval 仓库中工作。任何 code review 必须先读取并遵守 AGENTS.md。评测、评分、报告或发布改动还须读取 .agents/skills/benchmark-report/SKILL.md；解读文章改动还须读取 .agents/skills/benchmark-editorial/SKILL.md。
    review 输出必须使用中文；代码标识符、命令、第三方专有名词保留英文。
    review 必须简洁清晰，只输出结论、问题、建议、优先级和必要文件行号。
    不要输出英文模板、冗长摘要、完整检查清单、执行过程或大段规则复述。
    重点检查实际缺陷、需求达标、实现必要性、验证完整性、无用兼容、证据与评分一致性、双语一致性、凭据隔离和发布目标。依据当前代码和证据独立判断，不照单接受评论或历史结论。

concurrency:
  group: claude-local-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude:
    name: Claude 中文 Code Review
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'ready_for_review' || github.event.action == 'reopened'))
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Interactive @claude requests must not set `prompt`; the action uses the
      # user's comment as the task. In this repository, a bare @claude or most
      # @claude PR interactions are treated as review requests, so the same
      # review standards still apply through `claude_args`.
      - name: Run Claude Interactive
        if: github.event_name != 'pull_request'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path_to_claude_code_executable: /home/github/.local/bin/claude
          path_to_bun_executable: /home/github/.bun/bin/bun

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          claude_args: >-
            --system-prompt "${{ env.CLAUDE_REVIEW_STANDARDS }}"

      # Pull request events have no user comment, so this step supplies the
      # review task while reusing the same standards as interactive requests.
      - name: Run Claude PR Review
        if: github.event_name == 'pull_request'
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path_to_claude_code_executable: /home/github/.local/bin/claude
          path_to_bun_executable: /home/github/.bun/bin/bun
          track_progress: true

          additional_permissions: |
            actions: read

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            请审查当前 PR 的 diff。

            统一审查标准：
            ${{ env.CLAUDE_REVIEW_STANDARDS }}

            输出要求：
            - 只报告会影响合并判断的问题；不要省略任何符合这一标准的发现。
            - 每条发现必须包含优先级、文件行号、问题、建议。
            - 优先级使用 P0/P1/P2：P0 阻塞合并，P1 合并前建议修，P2 可后续优化。
            - Only post GitHub comments - don't submit review text as messages.

            输出格式：
            ## Review 结论
            通过 / 有条件通过 / 不通过

            ## 问题及建议
            - [P?] `path:line`：问题。建议：...

            如果没有发现影响合并的问题，`## 问题及建议` 只写：
            未发现需要阻塞合并的问题。残余风险：...

          claude_args: |
            --system-prompt "${{ env.CLAUDE_REVIEW_STANDARDS }}"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
