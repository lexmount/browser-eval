name: Claude Review

env:
  CLAUDE_REVIEW_STANDARDS: >-
    Work in browser-eval. Read and follow AGENTS.md before any code review. For benchmark, scoring, report or publication changes, also read .agents/skills/benchmark-report/SKILL.md; for interpretation articles, read .agents/skills/benchmark-editorial/SKILL.md.
    Write reviews in English unless the interactive request explicitly asks for another language. Preserve identifiers, commands and quoted evidence.
    Be concise: report the conclusion, actionable defects, recommendations, priorities and necessary file/line references.
    Omit long summaries, checklists, execution narration and repeated instructions.
    Check actual defects, requirements, implementation necessity, validation, redundant compatibility, evidence/scoring consistency, explicitly generated language parity, credential isolation and publication targets. Judge current code and evidence independently rather than accepting comments or historical conclusions blindly.

concurrency:
  group: claude-local-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude:
    name: Claude Code Review
    if: |
      vars.ENABLE_CLAUDE_REVIEW == 'true' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'ready_for_review' || github.event.action == 'reopened')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Interactive @claude requests must not set `prompt`; the action uses the
      # user's comment as the task. In this repository, a bare @claude or most
      # @claude PR interactions are treated as review requests, so the same
      # review standards still apply through `claude_args`.
      - name: Run Claude Interactive
        if: github.event_name != 'pull_request'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          claude_args: >-
            --system-prompt "${{ env.CLAUDE_REVIEW_STANDARDS }}"

      # Pull request events have no user comment, so this step supplies the
      # review task while reusing the same standards as interactive requests.
      - name: Run Claude PR Review
        if: github.event_name == 'pull_request'
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true

          additional_permissions: |
            actions: read

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review the current PR diff.

            Shared review standards:
            ${{ env.CLAUDE_REVIEW_STANDARDS }}

            Requirements:
            - Report every finding that affects the merge decision.
            - Include priority, file/line, problem and recommendation for each finding.
            - Use P0/P1/P2: P0 blocks merging, P1 should be fixed before merging, P2 can be followed up.
            - Only post GitHub comments - don't submit review text as messages.

            Format:
            ## Review conclusion
            Pass / Conditional pass / Fail

            ## Findings and recommendations
            - [P?] `path:line`: Problem. Recommendation: ...

            If no finding affects the merge decision, state that under
            `## Findings and recommendations` and describe any residual risk briefly.

          claude_args: |
            --system-prompt "${{ env.CLAUDE_REVIEW_STANDARDS }}"
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
