<!doctype html><html><head><meta charset="utf-8"><title>Deterministic Dynamic</title></head><body>
<h1>Dynamic Workflow Fixture</h1><button id="next">next</button><div id="page">page:1:start</div>
<button id="late" disabled>late action</button><div id="late-out">idle</div>
<div id="phase">phase:0</div><ul id="list"></ul>
<script>
const pageOut=document.getElementById('page'),phaseOut=document.getElementById('phase'),listOut=document.getElementById('list'),lateOut=document.getElementById('late-out');
let p=1; next.onclick=()=>{p++;pageOut.textContent='loading';setTimeout(()=>pageOut.textContent=`page:${p}:${p===2?'middle-31':'final-73'}`,180)};
setTimeout(()=>phaseOut.textContent='phase:1',120);setTimeout(()=>phaseOut.textContent='phase:2:W7',360);
['alpha-11','beta-23','gamma-47'].forEach((x,i)=>setTimeout(()=>{let li=document.createElement('li');li.textContent=x;listOut.appendChild(li)},100*(i+1)));
setTimeout(()=>{late.disabled=false;late.onclick=()=>lateOut.textContent='late:clicked:33'},240);
</script></body></html>
