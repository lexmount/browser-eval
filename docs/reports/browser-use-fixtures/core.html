<!doctype html>
<html><head><meta charset="utf-8"><title>Lexmount Eval Core</title></head>
<body>
<h1 id="title">Lexmount Deterministic Browser Fixture</h1>
<button id="inc">increment</button><div id="count">0</div>
<input id="echo-in" aria-label="echo input"><div id="echo-out">empty</div>
<select id="choice"><option value="alpha">Alpha</option><option value="gamma">Gamma</option></select>
<div id="choice-out">choice:alpha</div>
<input id="enter-in" aria-label="enter input"><div id="enter-out">idle</div>
<a id="page-two" href="page2.html">page two</a>
<div style="height:1800px">deterministic spacer</div><div id="bottom">bottom:73</div>
<script>
const inc=document.getElementById('inc'),count=document.getElementById('count'),choice=document.getElementById('choice');
inc.onclick=()=>count.textContent=String(Number(count.textContent)+1);
document.getElementById('echo-in').oninput=e=>document.getElementById('echo-out').textContent='echo:'+e.target.value;
choice.onchange=e=>document.getElementById('choice-out').textContent='choice:'+e.target.value;
document.getElementById('enter-in').onkeydown=e=>{if(e.key==='Enter')document.getElementById('enter-out').textContent='entered:'+e.target.value+':42'};
</script></body></html>
