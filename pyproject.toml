[project]
name = "browser-harness-eval"
version = "0.1.0"
description = "Reproducible browser service evaluation harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
browser-harness-eval = "harness.web_fetch.cli:main"

[project.optional-dependencies]
headless-eval = [
  "playwright==1.58.0",
  "pypdf>=5,<7",
]
reference-audit = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
]
webmainbench-eval = [
  "apted==1.0.3",
  "beautifulsoup4==4.13.5",
  "jieba==0.42.1",
  "openai==1.109.1",
  "python-dotenv==1.1.1",
  "rapidfuzz==3.14.1",
]
browser-use-eval = [
  "docker>=7,<8",
  "playwright>=1.52,<2",
  "tiktoken>=0.7,<1",
]
test = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "real_smoke: starts real browser containers and accesses a public website",
]

[tool.ruff]
line-length = 100
include = [
  "harness/browser_use/**/*.py",
  "tests/browser_use/**/*.py",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"harness/browser_use/report.py" = ["E501"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
