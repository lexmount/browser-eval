[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-harness-eval"
version = "0.1.0"
description = "Reproducible evaluation harness for agent browser tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
browser-harness-eval = "browser_harness_eval.cli:main"

[tool.setuptools.packages.find]
include = ["browser_harness_eval*"]
