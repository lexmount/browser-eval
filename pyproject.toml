[project]
name = "browser-harness-eval"
version = "0.4.0"
description = "Evaluation harness for browsers and Web tools: Web Fetch, Web Search and Browser Trajectory Replay"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.14.2",
  "soupsieve==2.9.2",
  "fastcdc==1.7.0",
  "python-dotenv==1.1.1",
]

[project.scripts]
browser-harness-eval = "harness.web_fetch.cli:main"
lexbench-webfetch = "lexbench_webfetch.cli:main"
lexbench-websearch = "lexbench_websearch.cli:main"

[project.urls]
Repository = "https://github.com/lexmount/browser-eval"
Issues = "https://github.com/lexmount/browser-eval/issues"

[project.optional-dependencies]
dataset-publish = ["huggingface-hub==1.31.0", "pyyaml>=6,<7"]
tree = ["apted==1.0.3", "rapidfuzz==3.14.1"]
headless-eval = [
  "docker>=7,<8",
  "playwright==1.58.0",
  "pypdf>=5,<7",
]
reference-audit = [
  "requests>=2.32,<3",
  "beautifulsoup4==4.14.2",
  "soupsieve==2.9.2",
  "pypdf>=5,<7",
]
webmainbench-eval = [
  "apted==1.0.3",
  "beautifulsoup4==4.14.2",
  "jieba==0.42.1",
  "markdown>=3.7,<4",
  "openai>=2.8,<4",
  "rapidfuzz==3.14.1",
]
browser-use-eval = [
  "docker>=7,<8",
  "json-repair>=0.54,<1",
  "pillow>=11,<13",
  "playwright>=1.52,<2",
  "pyyaml>=6,<7",
  "regex>=2025.7,<2027",
  "requests>=2.32,<3",
  "tiktoken>=0.7,<1",
  "webarena-verified @ git+https://github.com/lexmount/webarena-verified.git@da7b992eb10de78000f11a7f34fd4590c171fbd6",
]
test = [
  "pytest>=8,<10",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.9,<1",
]
oss-eval = [
    "crawl4ai==0.9.3",
    "langchain-community==0.3.30",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "real_smoke: accesses real containers or live deployment endpoints",
]

[tool.ruff]
line-length = 100
include = [
  "src/harness/environments/**/*.py",
  "tests/environments/**/*.py",
  "src/harness/browser_use/**/*.py",
  "src/harness/trajectory_replay/**/*.py",
  "tests/browser_use/**/*.py",
  "tests/trajectory_replay/**/*.py",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "TID252", "UP"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Retain scorer import spelling so published source hashes remain verifiable.
"src/lexbench_webfetch/*.py" = ["TID252"]
"src/lexbench_websearch/*.py" = ["TID252"]
"tests/benchmarks/webfetch/*.py" = ["TID252"]
"src/harness/trajectory_replay/report.py" = ["E501"]
"src/harness/trajectory_replay/webarena_report.py" = ["E501"]
"src/harness/browser_use/report.py" = ["E501"]
"src/harness/browser_use/report_i18n.py" = ["E501"]
"src/harness/trajectory_replay/public_webarena/report.py" = ["E501"]
"src/harness/trajectory_replay/public_webarena/metrics.py" = ["F401", "I001"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*", "lexbench_webfetch*", "lexbench_websearch*"]

[tool.setuptools.package-data]
"harness.benchmarks" = ["data-lock.json", "code-migration.json", "scoring-regressions.json", "cards/*.md", "cards/*.json"]
"harness.web_search" = ["messages.json", "data/*.json"]
"harness" = ["licenses/*.txt"]
"harness.trajectory_replay" = ["messages.json", "resources/fixtures/*.html"]
"harness.browser_use" = ["report-translations.json"]
"harness.lexbench" = ["assets/*.js", "assets/*.cjs"]
"harness.web_fetch" = ["report-translations.json", "data/*.json", "data/latency-certifiers/*.txt", "templates/*.html", "assets/methodology/*.png", "assets/*.js", "html_to_markdown.mjs"]
"harness.web_fetch.workers" = ["*.mts", "*.mjs", "*.c"]
"harness.environments.webarena" = ["runtime/*.ini"]

[tool.setuptools.data-files]
"share/browser-harness-eval/provenance" = ["pyproject.toml", "uv.lock"]
"share/browser-harness-eval" = ["configs/providers.headless.json"]
"share/browser-harness-eval/webmainbench" = ["evaluation/webmainbench-full/scoring-regressions.json"]
"share/browser-harness-eval/public-webarena" = ["evaluation/browser-use-public/adoption-evidence.json", "evaluation/browser-use-public/benchmark-catalog.json", "evaluation/browser-use-public/report-changes.json"]
