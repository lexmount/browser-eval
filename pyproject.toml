[project]
name = "browser-harness-eval"
version = "0.1.0"
description = "Reproducible browser service evaluation harness"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
browser-harness-eval = "harness.web_fetch.cli:main"

[project.urls]
Repository = "https://github.com/lexmount/browser-eval"
Issues = "https://github.com/lexmount/browser-eval/issues"

[tool.uv.sources]
webarena-verified = { git = "https://github.com/lexmount/webarena-verified.git", rev = "da7b992eb10de78000f11a7f34fd4590c171fbd6" }

[project.optional-dependencies]
headless-eval = [
  "docker>=7,<8",
  "playwright==1.58.0",
  "pypdf>=5,<7",
]
reference-audit = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
]
webmainbench-eval = [
  "apted==1.0.3",
  "beautifulsoup4==4.14.2",
  "jieba==0.42.1",
  "markdown>=3.7,<4",
  "openai>=2.8,<4",
  "python-dotenv==1.1.1",
  "rapidfuzz==3.14.1",
]
browser-use-eval = [
  "docker>=7,<8",
  "json-repair>=0.54,<1",
  "pillow>=11,<13",
  "playwright>=1.52,<2",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "regex>=2025.7,<2027",
  "requests>=2.32,<3",
  "tiktoken>=0.7,<1",
  "webarena-verified==1.2.3",
]
test = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
oss-eval = [
    "crawl4ai==0.9.3",
    "langchain-community==0.3.30",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "real_smoke: accesses real containers or live deployment endpoints",
]

[tool.ruff]
line-length = 100
include = [
  "harness/environments/**/*.py",
  "tests/environments/**/*.py",
  "harness/browser_use/**/*.py",
  "harness/trajectory_replay/**/*.py",
  "tests/browser_use/**/*.py",
  "tests/trajectory_replay/**/*.py",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"harness/trajectory_replay/report.py" = ["E501"]
"harness/trajectory_replay/webarena_report.py" = ["E501"]
"harness/browser_use/report.py" = ["E501"]
"harness/browser_use/report_i18n.py" = ["E501"]
"harness/trajectory_replay/public_webarena/report.py" = ["E501"]
"harness/trajectory_replay/public_webarena/metrics.py" = ["F401", "I001"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness" = ["licenses/*.txt"]
"harness.lexbench" = ["assets/*.js", "assets/*.cjs"]
"harness.web_fetch" = ["data/*.json", "templates/*.html", "assets/methodology/*.png", "html_to_markdown.mjs"]
"harness.environments.webarena" = ["runtime/*.ini"]
