[project]
name = "browser-harness-eval"
version = "0.1.0"
description = "Reproducible browser service evaluation harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
browser-harness-eval = "harness.web_fetch.cli:main"

[project.optional-dependencies]
headless-eval = [
  "docker>=7,<8",
  "playwright==1.58.0",
  "pypdf>=5,<7",
]
reference-audit = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
]
browser-use-eval = [
  "docker>=7,<8",
  "json-repair>=0.54,<1",
  "pillow>=11,<13",
  "playwright>=1.52,<2",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "regex>=2025.7,<2027",
  "requests>=2.32,<3",
  "tiktoken>=0.7,<1",
  "webarena-verified==1.2.3",
]
test = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
oss-eval = [
    "crawl4ai==0.9.3",
    "langchain-community==0.3.30",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "real_smoke: starts real browser containers and accesses a public website",
]

[tool.ruff]
line-length = 100
include = [
  "harness/browser_use/**/*.py",
  "harness/trajectory_replay/**/*.py",
  "tests/browser_use/**/*.py",
  "tests/trajectory_replay/**/*.py",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"harness/trajectory_replay/report.py" = ["E501"]
"harness/trajectory_replay/webarena_report.py" = ["E501"]
"harness/browser_use/report.py" = ["E501"]
"harness/browser_use/report_i18n.py" = ["E501"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
