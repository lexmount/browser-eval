[project]
name = "browser-harness-eval"
version = "0.4.0"
description = "Evaluation harness for browsers and Web tools: Web Fetch, Web Search and Browser Trajectory Replay"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.14.2",
  "soupsieve==2.9.2",
  "fastcdc==1.7.0",
  "python-dotenv==1.1.1",
  "idna==3.19",
  "markdown-it-py==4.2.0",
]

[project.scripts]
browser-harness-eval = "harness.web_fetch.cli:main"
lexbench-webfetch = "lexbench_webfetch.cli:main"
lexbench-websearch = "lexbench_websearch.cli:main"

[project.urls]
Repository = "https://github.com/lexmount/browser-eval"
Issues = "https://github.com/lexmount/browser-eval/issues"

[project.optional-dependencies]
dataset-publish = ["huggingface-hub==1.31.0", "pyyaml>=6,<7"]
tree = ["apted==1.0.3", "rapidfuzz==3.14.1"]
headless-eval = [
  "docker>=7,<8",
  "playwright==1.58.0",
  "pypdf>=5,<7",
]
reference-audit = [
  "requests>=2.32,<3",
  "beautifulsoup4==4.14.2",
  "soupsieve==2.9.2",
  "pypdf>=5,<7",
]
webmainbench-eval = [
  "apted==1.0.3",
  "beautifulsoup4==4.14.2",
  "jieba==0.42.1",
  "markdown>=3.7,<4",
  "openai>=2.8,<4",
  "rapidfuzz==3.14.1",
]
browser-use-eval = [
  "docker>=7,<8",
  "json-repair>=0.54,<1",
  "pillow>=11,<13",
  "playwright>=1.52,<2",
  "psutil>=7,<8",
  "pyyaml>=6,<7",
  "regex>=2025.7,<2027",
  "requests>=2.32,<3",
  "tiktoken>=0.7,<1",
  "webarena-verified @ git+https://github.com/lexmount/webarena-verified.git@da7b992eb10de78000f11a7f34fd4590c171fbd6",
]
test = [
  "fastapi==0.162.0",
  "httpx>=0.28,<1",
  "psutil>=7,<8",
  "pytest>=8,<10",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.9,<1",
  "uvicorn==0.54.0",
]
oss-eval = [
    "crawl4ai==0.9.3",
    "langchain-community==0.3.30",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
]

web-extract-eval = [
  "huggingface-hub==1.31.0",
  "jsonschema>=4.25,<5",
  "requests>=2.32,<3",
  "lxml>=5.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "real_smoke: accesses real containers or live deployment endpoints",
  "slow: one call takes about eight seconds or more; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
include = [
  "src/harness/web_extract/**/*.py",
  "tests/web_extract/**/*.py",
  "src/harness/environments/**/*.py",
  "tests/environments/**/*.py",
  "src/harness/browser_use/**/*.py",
  "src/harness/trajectory_replay/**/*.py",
  "tests/browser_use/**/*.py",
  "tests/trajectory_replay/**/*.py",
  "src/harness/benchmarks/**/*.py",
  "src/harness/lexbench/**/*.py",
  "src/harness/reporting/**/*.py",
  "src/harness/web_search/**/*.py",
  "src/harness/container_isolation.py",
  "src/harness/benchmark_execution.py",
  "src/harness/data_home.py",
  "src/harness/distribution.py",
  "src/harness/env_file.py",
  "src/harness/fix_log.py",
  "src/harness/numbers.py",
  "src/harness/package_gate.py",
  "src/harness/platform_capabilities.py",
  "src/harness/record_io.py",
  "src/harness/report_languages.py",
  "src/harness/resource_accounting.py",
  "src/harness/resource_calibration.py",
  "src/harness/review_runner.py",
  "src/harness/webarena_state.py",
  "scripts/**/*.py",
  "examples/**/*.py",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "TID252", "UP"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/harness/web_extract/report.py" = ["E501"]
# Retain scorer import spelling so published source hashes remain verifiable.
"src/lexbench_webfetch/*.py" = ["TID252", "B023", "B905"]
"src/lexbench_websearch/*.py" = ["TID252", "B905"]
"tests/benchmarks/webfetch/*.py" = ["TID252"]
# Evidence binds these sources' hashes: Search collection_implementation and visual receipts,
# the Lexbench resource orchestrator and the latency runners. Do not edit them for style.
"src/harness/web_fetch/webmainbench_latency_correction.py" = ["B905"]
"src/harness/web_fetch/webmainbench_latency_diagnostic.py" = ["B905"]
"src/harness/lexbench/resource_profiles.py" = ["I001"]
"src/harness/reporting/visual.py" = ["I001"]
"src/harness/web_search/core.py" = ["I001"]
"src/harness/web_search/profiles.py" = ["I001"]
"src/harness/web_search/runner.py" = ["I001"]
"src/harness/web_search/visual.py" = ["B023", "I001"]
# Long lines are not rewrapped; scripts insert src/ on sys.path before importing it.
"src/harness/benchmarks/**/*.py" = ["E501"]
"src/harness/lexbench/**/*.py" = ["E501"]
"src/harness/reporting/**/*.py" = ["E501"]
"src/harness/web_search/**/*.py" = ["E501"]
"src/harness/distribution.py" = ["E501"]
"src/harness/env_file.py" = ["E501"]
"src/harness/platform_capabilities.py" = ["E501"]
"src/harness/report_languages.py" = ["E501"]
"src/harness/resource_calibration.py" = ["E501"]
"scripts/**/*.py" = ["E402", "E501"]
"examples/**/*.py" = ["E501"]
"src/harness/trajectory_replay/report.py" = ["E501"]
"src/harness/trajectory_replay/webarena_report.py" = ["E501"]
"src/harness/browser_use/report.py" = ["E501"]
"src/harness/browser_use/report_check.py" = ["E501"]
"src/harness/browser_use/report_i18n.py" = ["E501"]
"src/harness/trajectory_replay/public_webarena/report.py" = ["E501"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*", "lexbench_webfetch*", "lexbench_websearch*"]

[tool.setuptools.package-data]
"harness.benchmarks" = ["data-lock.json", "code-migration.json", "scoring-regressions.json", "cards/*.md", "cards/*.json"]
"harness.web_search" = ["messages.json", "data/*.json"]
"harness.web_extract" = ["messages.json", "assets/*.css", "assets/*.js", "firecrawl_backend.mjs"]
"harness" = ["licenses/*.txt"]
"harness.trajectory_replay" = ["messages.json", "resources/fixtures/*.html"]
"harness.browser_use" = ["messages.json"]
"harness.lexbench" = ["assets/*.js", "assets/*.cjs", "template/*"]
"harness.web_fetch" = ["messages.json", "report-translations.json", "data/*.json", "data/latency-certifiers/*.txt", "templates/*.html", "assets/methodology/*.png", "assets/*.js", "html_to_markdown.mjs"]
"harness.web_fetch.workers" = ["*.mts", "*.mjs", "*.c"]
"harness.environments.webarena" = ["runtime/*.ini", "topology.json"]

# Copied to harness/distribution_data/ by setup.py; MANIFEST.in keeps them in the sdist.
[tool.browser-eval]
bundled-data = [
  "pyproject.toml",
  "uv.lock",
  "configs/providers.headless.json",
  "evaluation/webmainbench-full/scoring-regressions.json",
  "evaluation/browser-use-public/adoption-evidence.json",
  "evaluation/browser-use-public/benchmark-catalog.json",
  "evaluation/browser-use-public/report-changes.json",
]
